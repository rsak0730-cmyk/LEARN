name: Build CodeVerse

on:
  push:
    branches: ["main", "master"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build production site
        run: npm run build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: codeverse-dist
          path: dist
